<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a3b">
<title>화명 테니스장 조출 알리미</title>
<script>
  const VAPID_PUBLIC_KEY = "BLhLqsvJb80wlgEiTJ25wTARHbKqq-pik22FGoPPAgQ7yao2HKpxuSwwTlyOIFBizUBqn184tECTYnq3-RXFisQ";
  const RELAY_POST_URL   = "https://script.google.com/macros/s/AKfycbwPo3Iba5PZauiZ8QGGFyQeC1d_iiy-FoP87wHTIew-zWTt653FSbfKoogI_STxdOGJ/exec";
</script>
<style>
  :root { --green:#0b7a3b; --green-d:#095e2e; --bg:#f4f6f5; --card:#fff; --line:#e3e7e5; --text:#1c2620; --muted:#6b7770; --warn:#c9411f; --warnbg:#fdeee9; --okbg:#e7f6ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Malgun Gothic","맑은 고딕",system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap { max-width:520px; margin:0 auto; padding:18px 16px 44px; }
  header { text-align:center; padding:16px 0 4px; }
  .ball { font-size:44px; }
  h1 { font-size:19px; margin:6px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px; }
  /* 조출 브리핑 히어로 */
  .hero { text-align:center; padding:26px 18px; }
  .hero.none { background:#eef2f0; }
  .hero.ok   { background:var(--okbg); border-color:#bfe6cb; }
  .hero.warn { background:var(--warnbg); border-color:#f2c6b8; }
  .hero .big { font-size:26px; font-weight:800; margin:2px 0 6px; }
  .hero.warn .big { color:var(--warn); }
  .hero.ok .big { color:var(--green-d); }
  .hero .detail { font-size:15px; white-space:pre-line; }
  .hero .when { font-size:12px; color:var(--muted); margin-top:10px; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-main { background:var(--green); color:#fff; }
  .btn-sub { background:#eef2f0; color:var(--green-d); margin-top:9px; font-size:14px; }
  .btn:disabled { opacity:.5; }
  #status { font-size:13px; padding:10px 12px; border-radius:10px; margin-top:12px; background:#eef4f0; color:var(--green-d); word-break:keep-all; }
  #status.err { background:#fdecec; color:#b3261e; }
  #status.ok  { background:var(--okbg); color:var(--green); }
  .label { font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:700; }
  .steps { font-size:13px; color:var(--muted); padding-left:18px; margin:6px 0 0; }
  .steps li { margin:4px 0; }
  details { margin-top:12px; }
  summary { font-size:13px; color:var(--muted); cursor:pointer; }
  textarea { width:100%; height:100px; font-size:11px; font-family:monospace; border:1px solid var(--line); border-radius:10px; padding:10px; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ball">🎾</div>
    <h1>화명 테니스장 조출 알리미</h1>
    <p class="sub">내일 07~09시 예약(조기출근) 여부</p>
  </header>

  <!-- 조출 브리핑 (핵심) -->
  <div id="hero" class="card hero none">
    <div class="big" id="heroBig">불러오는 중…</div>
    <div class="detail" id="heroDetail"></div>
    <div class="when" id="heroWhen"></div>
  </div>
  <button id="refreshBtn" class="btn btn-sub">새로고침</button>

  <!-- 알림 설정 -->
  <div class="card">
    <div class="label">알림 설정</div>
    <button id="subscribeBtn" class="btn btn-main">알림 받기</button>
    <button id="unsubBtn" class="btn btn-sub">알림 해제</button>
    <button id="testBtn" class="btn btn-sub">테스트 알림 (폰 표시 확인)</button>
    <div id="status">준비 중…</div>
    <details id="manualBox" class="hide">
      <summary>자동 등록이 안 되면 여기를 눌러 코드 복사</summary>
      <textarea id="subJson" readonly></textarea>
      <button id="copyBtn" class="btn btn-sub">코드 복사</button>
    </details>
  </div>

  <div class="card">
    <div class="label">안내</div>
    <ol class="steps">
      <li><b>Chrome</b>(삼성브라우저 아님)에서 이 페이지를 여세요.</li>
      <li>[알림 받기] → 허용. 매일 밤 '내일 조출 여부'가 알림으로 옵니다.</li>
      <li>알림을 놓쳐도, 이 페이지를 열면 최신 결과가 위에 표시됩니다.</li>
      <li>홈 화면에 추가해두면 앱처럼 편합니다.</li>
    </ol>
  </div>
</div>

<script>
const statusEl = document.getElementById('status');
const subscribeBtn = document.getElementById('subscribeBtn');
const manualBox = document.getElementById('manualBox');
const subJsonEl = document.getElementById('subJson');
const hero = document.getElementById('hero');

function setStatus(msg, kind) { statusEl.textContent = msg; statusEl.className = kind || ''; }

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

// 저장된 최신 조출 브리핑 표시
// 중계에서 조출 상태를 JSONP 로 읽는다(CORS 회피).
function jsonpStatus() {
  return new Promise((resolve) => {
    if (!RELAY_POST_URL || RELAY_POST_URL.indexOf('여기에') === 0) { resolve(null); return; }
    const cb = '__st' + Date.now() + Math.floor(Math.random() * 1000);
    let done = false;
    const s = document.createElement('script');
    function cleanup() { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (data) => { if (done) return; done = true; cleanup(); resolve(data); };
    s.onerror = () => { if (done) return; done = true; cleanup(); resolve(null); };
    s.src = RELAY_POST_URL + (RELAY_POST_URL.indexOf('?') >= 0 ? '&' : '?') + 'status=1&callback=' + cb + '&_=' + Date.now();
    document.head.appendChild(s);
    setTimeout(() => { if (!done) { done = true; cleanup(); resolve(null); } }, 8000);
  });
}

const WK = ['일', '월', '화', '수', '목', '금', '토'];
function renderBriefing(d) {
  const big = document.getElementById('heroBig');
  const detail = document.getElementById('heroDetail');
  const when = document.getElementById('heroWhen');
  if (!d || !d.date) {
    hero.className = 'card hero none';
    big.textContent = '아직 브리핑이 없어요';
    detail.textContent = '평일 오전 9시에 자동으로 여기에 표시됩니다.';
    when.textContent = '';
    return;
  }
  const dt = new Date(d.date + 'T00:00:00');
  const md = (dt.getMonth() + 1) + '/' + dt.getDate() + '(' + WK[dt.getDay()] + ')';
  if (d.hasEarly) {
    hero.className = 'card hero warn';
    big.textContent = md + ' 조출 있음 ⚠️';
    detail.textContent = (d.body || '') + '\n조기출근 준비하세요.';
  } else {
    hero.className = 'card hero ok';
    big.textContent = md + ' 조출 없음';
    detail.textContent = d.body || '정상 출근.';
  }
  when.textContent = d.at ? ('확인: ' + d.at) : '';
}

async function showLastBriefing() {
  const s = await jsonpStatus();
  if (s && s.date) { renderBriefing(s); return; }
  // 폴백: 푸시로 저장된 값
  try {
    const cache = await caches.open('briefing');
    const res = await cache.match('/last');
    if (res) {
      const d = await res.json();
      renderBriefing({ date: d.date, hasEarly: (d.title || '').indexOf('있음') >= 0, body: d.body,
        at: d.at ? new Date(d.at).toLocaleString('ko-KR') : '' });
      return;
    }
  } catch (e) {}
  renderBriefing(null);
}

async function sendToRelay(sub) {
  if (!RELAY_POST_URL || RELAY_POST_URL.indexOf('여기에') === 0) return false;
  try {
    await fetch(RELAY_POST_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(sub.toJSON ? sub.toJSON() : sub),
    });
    return true;
  } catch (e) { return false; }
}

function showManual(sub) {
  subJsonEl.value = JSON.stringify(sub.toJSON ? sub.toJSON() : sub, null, 2);
  manualBox.classList.remove('hide');
}

async function init() {
  showLastBriefing();
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    setStatus('이 브라우저는 알림을 지원하지 않습니다. Chrome 으로 열어주세요.', 'err');
    subscribeBtn.disabled = true; return;
  }
  try {
    const reg = await navigator.serviceWorker.register('./sw.js');
    const existing = await reg.pushManager.getSubscription();
    if (existing) {
      await sendToRelay(existing);
      setStatus('알림이 켜져 있습니다.', 'ok');
      subscribeBtn.textContent = '알림 다시 등록';
    } else {
      setStatus('아래 [알림 받기]를 눌러주세요.');
    }
    // SW 활성 후 다시 한 번 최신 표시
    setTimeout(showLastBriefing, 500);
  } catch (e) {
    setStatus('초기화 실패: ' + e.message + ' (HTTPS 주소로 열어야 합니다)', 'err');
  }
}

async function subscribe() {
  subscribeBtn.disabled = true;
  setStatus('알림 권한 요청 중…');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      setStatus('알림이 거부되었습니다. 브라우저 설정에서 알림을 허용해 주세요.', 'err');
      subscribeBtn.disabled = false; return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const sent = await sendToRelay(sub);
    if (sent) setStatus('✅ 알림이 켜졌습니다!', 'ok');
    else { setStatus('알림은 켜졌지만 자동 등록 실패 — 아래 코드를 관리자에게 전달하세요.', 'err'); showManual(sub); }
    subscribeBtn.textContent = '알림 다시 등록';
  } catch (e) {
    setStatus('등록 실패: ' + e.message, 'err');
  } finally {
    subscribeBtn.disabled = false;
  }
}

subscribeBtn.addEventListener('click', subscribe);
document.getElementById('unsubBtn').addEventListener('click', async () => {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await sub.unsubscribe();
      setStatus('알림을 해제했습니다. 다시 받으려면 [알림 받기]를 누르세요.', 'ok');
      subscribeBtn.textContent = '알림 받기';
    } else {
      setStatus('현재 구독 중이 아닙니다.', 'ok');
    }
  } catch (e) { setStatus('해제 실패: ' + e.message, 'err'); }
});
document.getElementById('refreshBtn').addEventListener('click', showLastBriefing);
document.getElementById('testBtn').addEventListener('click', async () => {
  try {
    if (Notification.permission !== 'granted') { setStatus('먼저 [알림 받기]로 권한을 허용해 주세요.', 'err'); return; }
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('🎾 테스트 알림', { body: '이게 보이면 폰의 알림 표시는 정상입니다.', icon: './icon.png', tag: 'test', renotify: true });
    setStatus('테스트 알림을 띄웠습니다. 폰 화면/알림창을 확인하세요.', 'ok');
  } catch (e) { setStatus('테스트 알림 실패: ' + e.message, 'err'); }
});
document.getElementById('copyBtn').addEventListener('click', async () => {
  subJsonEl.select();
  try { await navigator.clipboard.writeText(subJsonEl.value); setStatus('복사됨!', 'ok'); }
  catch (_) { document.execCommand('copy'); setStatus('복사됨!', 'ok'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) showLastBriefing(); });

init();
</script>
</body>
</html>
